<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行政大樓牆面整修工程｜廠商修繕紀錄</title>
  <meta name="description" content="行政大樓牆面整修工程施工前後比較。">
  <link rel="stylesheet" href="../../style.css">
  <style>
    .compare{position:relative;aspect-ratio:16/9;overflow:hidden;background:#dfe8e6;border:1px solid #cdd9d6;--pos:50%;user-select:none;-webkit-user-select:none}
    .compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .compare .before{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
    .compare .handle{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none;z-index:2}
    .compare .handle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#fff;color:#21766a;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .compare input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:3}
    .compare .label{position:absolute;top:14px;z-index:1;padding:6px 12px;border-radius:4px;background:rgba(18,60,58,.8);color:#fff;font-size:14px;pointer-events:none}
    .compare .label.l{left:14px}
    .compare .label.r{right:14px}
    .compare-hint{color:#647770;font-size:14px;margin:14px 0 0}
    .compare-wrap{margin-top:8px}
  </style>
</head>
<body>
<header><a href="../../">總務處 <b>校園修繕紀錄</b></a><span>廠商修繕紀錄</span></header>
<main>
  <div class="intro"><div><div class="eyebrow">校園維護・廠商紀錄</div><h1>行政大樓牆面<br><em>整修工程</em></h1><p>施工前後比較。</p></div></div>
  <a class="back-index" href="../">← 回廠商修繕紀錄</a>
  <section class="job">
    <div class="jobhead"><div class="date">11<small>2026</small></div><div><span class="tag">牆面整修</span><h2>行政大樓牆面整修工程</h2><p>行政大樓外牆整修前後的比較。左右拖曳中間的線，可對照施工前與施工後。</p><span class="count">共 4 張照片（施工前 3 張、施工後 1 張）</span></div></div>
    <div class="compare-wrap">
      <div class="compare" id="compare">
        <img class="after" src="../../assets/vendor/wall-05.jpg" alt="行政大樓牆面整修工程，施工後" loading="lazy">
        <img class="before" src="../../assets/vendor/wall-01.jpg" alt="行政大樓牆面整修工程，施工前" loading="lazy">
        <span class="label l">施工前</span>
        <span class="label r">施工後</span>
        <div class="handle"></div>
        <input type="range" min="0" max="100" value="50" aria-label="拖曳比較施工前與施工後">
      </div>
      <p class="compare-hint">拖曳中間的把手，或點選下方照片可放大檢視。</p>
    </div>
    <div class="gallery"><figure><button class="photo" data-src="../../assets/vendor/wall-01.jpg" data-caption="行政大樓牆面整修工程｜施工前 01"><img src="../../assets/vendor/wall-01.jpg" alt="行政大樓牆面整修工程，施工前 1" loading="lazy"></button><figcaption>施工前 01</figcaption></figure><figure><button class="photo" data-src="../../assets/vendor/wall-03.jpg" data-caption="行政大樓牆面整修工程｜施工前 02"><img src="../../assets/vendor/wall-03.jpg" alt="行政大樓牆面整修工程，施工前 2" loading="lazy"></button><figcaption>施工前 02</figcaption></figure><figure><button class="photo" data-src="../../assets/vendor/wall-04.jpg" data-caption="行政大樓牆面整修工程｜施工前 03"><img src="../../assets/vendor/wall-04.jpg" alt="行政大樓牆面整修工程，施工前 3" loading="lazy"></button><figcaption>施工前 03</figcaption></figure><figure><button class="photo" data-src="../../assets/vendor/wall-05.jpg" data-caption="行政大樓牆面整修工程｜施工後"><img src="../../assets/vendor/wall-05.jpg" alt="行政大樓牆面整修工程，施工後" loading="lazy"></button><figcaption>施工後</figcaption></figure></div>
  </section>
  <footer><p>總務處校園修繕紀錄　·　<a href="https://github.com/hsiang0422-star/campus-maintenance-photo-report-site">GitHub 專案 ↗</a></p></footer>
</main>
<dialog><button class="close" aria-label="關閉">×</button><img alt=""><p></p></dialog>
<script>
  (function(){
    var box=document.getElementById('compare');
    var range=box.querySelector('input');
    function setPos(){box.style.setProperty('--pos', range.value+'%');}
    range.addEventListener('input', setPos);
    setPos();
  })();
</script>
<script src="../../app.js"></script>
</body>
</html>
